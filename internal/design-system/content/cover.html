<!-- @dsCard height=288 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--background);
      }
      .cover {
        position: relative;
        width: 960px;
        height: 288px;
        overflow: hidden;
        background: var(--background);
      }
      .cover svg {
        position: absolute;
        left: 480px;
        top: 0;
      }
      .t {
        rx: var(--radius-lg);
        ry: var(--radius-lg);
      }
      .tl {
        rx: var(--radius-xl);
        ry: var(--radius-xl);
      }
      .primary {
        fill: var(--primary);
      }
      .deep {
        fill: var(--chart-5);
      }
      .light {
        fill: var(--chart-1);
      }
      .ink {
        fill: var(--foreground);
      }
      .ink-40 {
        fill: var(--foreground);
        fill-opacity: 0.4;
      }
      .ink-15 {
        fill: var(--foreground);
        fill-opacity: 0.15;
      }
      .text {
        position: absolute;
        left: 40px;
        bottom: 32px;
        max-width: 440px;
      }
      .name {
        margin: 0;
        font-family: var(--font-heading);
        font-weight: 600;
        font-size: 88px;
        line-height: 0.95;
        letter-spacing: -0.035em;
        color: var(--foreground);
      }
      .tag {
        margin: 16px 0 0;
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 20px;
        color: var(--muted-foreground);
      }
    </style>
  </head>
  <body>
    <div class="cover">
      <!--
    blocks: primary 3×3 tiles (136px), chart-5 2×2 (88px), chart-1 3×2 (136×88), foreground 2×1 (88×40); ink at 40% / 15% fills the rest of the grid, as in the mark.
    arrangement: a flush modular grid right of x=480, pitch spacing-10 + spacing-2 (48px), merged tiles bleeding off the top and right edges.
    pattern: "geometric, modular, dense UI → tiles cut by the radius tokens, some merged" — the mark is four tiles at 40/40/15% ink, and the library is compact 32px controls.
    scales: tile 40px (spacing-10), gap 8px (spacing-2), single tiles radius-lg, merged blocks radius-xl.
  -->
      <svg width="480" height="288" viewBox="0 0 480 288" aria-hidden="true">
        <!-- row -1 bleed -->
        <rect class="tl primary" x="56" y="-24" width="136" height="136" />
        <rect class="t ink" x="296" y="-24" width="88" height="40" />
        <rect class="t ink-15" x="392" y="-24" width="40" height="40" />
        <rect class="t ink-40" x="440" y="-24" width="40" height="40" />
        <!-- row 0 -->
        <rect class="t ink-40" x="8" y="24" width="40" height="40" />
        <rect class="tl deep" x="200" y="24" width="88" height="88" />
        <rect class="t ink-15" x="296" y="24" width="40" height="40" />
        <rect class="tl light" x="344" y="24" width="136" height="88" />
        <!-- row 1 -->
        <rect class="t ink-15" x="8" y="72" width="40" height="40" />
        <rect class="t ink-40" x="296" y="72" width="40" height="40" />
        <!-- row 2 -->
        <rect class="t ink-15" x="56" y="120" width="40" height="40" />
        <rect class="t ink-40" x="104" y="120" width="40" height="40" />
        <rect class="t ink" x="152" y="120" width="88" height="40" />
        <rect class="t ink-15" x="248" y="120" width="40" height="40" />
        <rect class="tl primary" x="296" y="120" width="88" height="88" />
        <rect class="t ink-15" x="392" y="120" width="40" height="40" />
        <rect class="t ink-40" x="440" y="120" width="40" height="40" />
        <!-- row 3 -->
        <rect class="t ink-40" x="200" y="168" width="40" height="40" />
        <rect class="t ink-15" x="248" y="168" width="40" height="40" />
        <rect class="tl light" x="392" y="168" width="88" height="88" />
        <!-- row 4 -->
        <rect class="t ink-15" x="152" y="216" width="40" height="40" />
        <rect class="tl deep" x="200" y="216" width="88" height="88" />
        <rect class="t ink-15" x="296" y="216" width="40" height="40" />
        <rect class="t ink-40" x="344" y="216" width="40" height="40" />
        <!-- row 5 bleed -->
        <rect class="t ink-40" x="104" y="264" width="40" height="40" />
        <rect class="t ink" x="392" y="264" width="88" height="40" />
      </svg>
      <div class="text">
        <h1 class="name">Codefast<br />UI</h1>
        <p class="tag">Accessible React components on Radix and Tailwind CSS 4, themed in plain CSS.</p>
      </div>
    </div>
  </body>
</html>
