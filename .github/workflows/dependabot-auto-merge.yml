name: Dependabot auto-merge

# Flags Dependabot PRs for auto-merge; GitHub merges once the required "Verify"
# check passes (no merge queue — a GITHUB_TOKEN-created merge group would never
# trigger merge_group CI). Majors are left for manual review.
# A bump whose lockfile needs `pnpm dedupe` fails Verify and waits: push the
# deduped lockfile to its branch and the armed auto-merge completes.
# pull_request_target skips the approval gate bot-authored release PRs hit under
# pull_request; safe only because no step checks out or runs PR code.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # The PR's author and head repo, not github.actor: the actor is whoever fired the
    # latest event, and this trigger hands fork PRs a write token.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
