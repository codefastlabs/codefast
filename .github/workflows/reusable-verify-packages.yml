# Step order: type-aware oxlint needs built `dist` typings for workspace `package.json` exports.
# Sequence — build packages, then repo-wide lint + format check and per-package check-types, then
# (heavy lane only) tests with coverage.

name: Reusable verify packages

on:
  workflow_call:
    inputs:
      run-tests:
        description: >-
          Run the heavy coverage suite. Pass false for fast lint/type-only
          feedback when another lane already covers tests.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify-packages:
    name: Workspace Package Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Build Environment
        uses: ./.github/actions/setup-environment

      - name: Build Workspace Packages
        run: npx turbo build --filter="./packages/**" --filter="./internal/**"

      # `codefast mirror` generates `package.json#exports` from `dist/`, so a module added, moved or
      # renamed in `src/` silently changes the published surface until someone reruns it. Mirror is
      # idempotent: a diff here means it was not rerun.
      - name: Verify Generated Package Exports
        run: |
          pnpm cli:mirror
          if ! git diff --exit-code -- ':(glob)**/package.json'; then
            echo "::error::package.json exports are stale — run 'pnpm cli:mirror' and commit the result"
            exit 1
          fi

      # `lint` and `format:check` are root-workspace tasks in turbo.json (`//#lint`, `//#format:check`),
      # so a `--filter="./packages/**"` drops both without failing — this step once ran neither, and
      # a file committed unformatted stayed green. Both root scripts already scan the whole repo, and
      # calling them directly cannot silently resolve to zero tasks. Only `check-types` is per-package.
      - name: Validate Code Quality and Type Safety
        run: |
          pnpm lint
          pnpm format:check
          npx turbo run check-types --filter="./packages/**" --filter="./internal/**"

      # Repo-wide on purpose: the cross-package references are the ones most likely to rot, and a
      # dangling anchor into another document degrades to a scroll rather than a visible 404.
      - name: Verify Documentation Cross-References
        run: pnpm cli:audit:links

      # oxlint bans namespace/default React imports natively, but an implicit `React.*`
      # UMD-global type reference passes both lint and tsc — only this audit sees it.
      - name: Verify React Import Policy
        run: pnpm cli:audit:react

      - name: Execute Automated Tests with Coverage
        if: ${{ inputs.run-tests }}
        run: npx turbo run test:coverage --filter="./packages/**" --filter="./internal/**"

      - name: Publish Coverage Results to Codecov
        if: ${{ inputs.run-tests }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: false
