name: Package release

on:
  push:
    branches:
      - main
      - canary
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/reusable-verify-packages.yml"
      - ".github/actions/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "packages/**"
      - "internal/**"
      - ".changeset/**"
      # changeset version reads every workspace manifest, including private apps/examples/benchmarks
      - "apps/*/package.json"
      - "examples/*/package.json"
      - "benchmarks/*/package.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-code:
    name: Verify packages
    uses: ./.github/workflows/reusable-verify-packages.yml
    secrets: inherit

  release:
    name: Publish packages
    runs-on: ubuntu-latest
    needs:
      - verify-code
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      NODE_ENV: production
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Build packages
        run: npx turbo build --filter="./packages/**"

      - name: Configure Git identity
        run: |
          git config user.name "Vuong Phan"
          git config user.email "13298232+thevuong@users.noreply.github.com"

      # No npm token: pnpm publish authenticates to npm via OIDC trusted publishing, using the job's id-token permission.
      - name: Version and publish
        uses: changesets/action@v2.1.1
        with:
          version-script: pnpm run version-packages
          publish-script: npx changeset publish
          commit-message: "chore: update versions for release"
          pr-title: "chore: release new version"
          # Keep the Git CLI so release commits keep the identity set above; v2 defaults to GitHub-API pushes.
          push-with-git-cli: true
          github-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
