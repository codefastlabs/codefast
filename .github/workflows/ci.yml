name: CI

on:
  pull_request:
    branches:
      - main
      - canary
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/reusable-verify-packages.yml
    # A called workflow can only keep or drop the caller's permissions, so the OIDC grant starts here.
    permissions:
      contents: read
      id-token: write
    # No merge queue, so the PR run is the only pre-merge gate — run the full
    # test + coverage suite here (run-tests defaults to true).
    secrets: inherit

  # Run the unit suite on the supported Node lines `verify` (on the latest, from .node-version) does not
  # cover, so the floor is a contract CI proves. Publish-surface correctness is a static check in
  # `verify` (audit publish), not a per-Node runtime step.
  node-matrix:
    name: Node Matrix (${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 24.0.0 is the engines floor itself, which the dev toolchain (pnpm) runs on too; the current
        # line (26) is covered by `verify`.
        node: ["24.0.0"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ matrix.node }}
          # Turbo leaves the runtime out of the task hash, so a shared cache could replay another Node line's results.
          enable-remote-cache: false

      - name: Build Workspace Packages
        run: npx turbo build --filter="./packages/**" --filter="./internal/**"

      - name: Run Unit Tests
        run: npx turbo run test:unit --filter="./packages/**" --filter="./internal/**"
