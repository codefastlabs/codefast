name: "Setup Node.js and pnpm Environment"
description: "Sets up Node.js, pnpm, and project dependencies with caching for
  efficient CI/CD builds"
author: "codefastlabs"

inputs:
  node-version:
    description: "Explicit Node.js version; overrides node-version-file when set (e.g. a CI matrix leg)"
    default: ""
    required: false

  node-version-file:
    description: "File containing the Node.js version to use (e.g. .node-version)"
    default: ".node-version"
    required: false

  package-manager-version:
    description: "pnpm version; leave unset to use the packageManager field in root
      package.json"
    required: false

  install-dependencies:
    description: "Whether to install dependencies"
    default: "true"
    required: false

  install-options:
    description: "Additional options for pnpm install"
    default: "--prefer-offline --frozen-lockfile"
    required: false

  enable-remote-cache:
    description: "Whether to enable Turborepo remote caching"
    default: "true"
    required: false

outputs:
  turbo-cache-hit:
    description: "Whether Turborepo cache was hit"
    value: ${{ steps.turbo-cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    # Job-wide, not on the install step: `pnpm run` reinstalls when a manifest is rewritten after the install, and the
    # root `prepare` in that install would add hooks for a CI commit or push to run.
    - name: "Skip Git Hook Installation"
      shell: bash
      run: echo "SKIP_INSTALL_SIMPLE_GIT_HOOKS=true" >> "$GITHUB_ENV"

    - name: "Setup Turborepo Cache"
      id: turbo-cache
      uses: actions/cache@v6
      with:
        path: .turbo
        # Primary key excludes commit SHA so restores apply across commits for the same ref and lockfile.
        key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}-${{
          github.ref_name }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}-
          ${{ runner.os }}-turbo-

    - name: "Set Up pnpm Package Manager"
      id: pnpm-setup
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.package-manager-version }}
        run_install: false

    - name: "Set Up Node.js Environment"
      id: node-setup
      uses: actions/setup-node@v7
      with:
        # An explicit node-version wins; an empty string falls back to node-version-file (.node-version).
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && inputs.node-version-file || '' }}
        cache: "pnpm"

    - name: "Install Project Dependencies (pnpm)"
      id: pnpm-install
      shell: bash
      if: ${{ inputs.install-dependencies == 'true' }}
      run: pnpm install ${{ inputs.install-options }}

    - name: "Log Turborepo remote cache context"
      id: turbo-remote-cache
      shell: bash
      if: ${{ inputs.enable-remote-cache == 'true' && env.TURBO_TOKEN != '' &&
        env.TURBO_TEAM != '' }}
      run: |
        echo "Turborepo remote cache credentials are present for team: $TURBO_TEAM"
        npx turbo --version
