packages:
  - apps/*
  - examples/*
  - packages/**
  - internal/*
  - benchmarks/*

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  simple-git-hooks: true

overrides:
  # Hold every transitive `@types/node` (`"*"` from jest's types) to the lowest floor's line, so no
  # package type-checks against APIs its floor lacks. The `@*` key matches any semver spec but never a `catalog:` one,
  # which is how a package's own `catalog:node<major>.<minor>` keeps its line; `codefast audit engines` checks the
  # lockfile for it.
  "@types/node@*": "catalog:node22.12"
  # mermaid pins chevrotain `~11.1.2`, whose packages pin an exact lodash-es below the fix for
  # GHSA-r5fr-rjxr-66jc and GHSA-f23m-r3pf-42rh; scoped to the vulnerable range so it lapses once chevrotain moves on.
  "lodash-es@<4.18.0": ^4.18.0
  # TanStack devtools reach solid-js only as an auto-installed peer, which `pnpm update` never re-resolves; 1.9.17
  # moves it onto seroval 1.6.8, past GHSA-p6vx-979v-rg4c and GHSA-jp82-f5mq-hwhp. Scoped so it lapses on its own.
  "solid-js@<1.9.17": ^1.9.17
  # mermaid still pins katex `^0.16.47`, below the fix for GHSA-238p-pmpm-9mq7; it calls only `renderToString`, which
  # the later majors keep. Scoped to the vulnerable range so it lapses once mermaid moves on.
  "katex@<0.18.2": ^0.19.0

# One catalog per Node floor in use, pinning `@types/node` to the newest line that declares nothing the floor lacks, so a
# newer API is a type error. A package names the one its `engines.node` floor sits on; Dependabot leaves these alone.
catalogs:
  node22.12:
    "@types/node": ~22.12.0
  node22.18:
    "@types/node": ~22.18.13
  node22.22:
    "@types/node": ~22.20.5

