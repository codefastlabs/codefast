# `strict`: `pnpm add` routes every dep through the catalog — a new one is
# inserted there, a range conflicting with an existing entry is refused. A
# hand-edited manifest is unchecked, so one-version-per-dep still needs review.
catalogMode: strict

# 1h maturation window instead of pnpm's 24h default — short enough that our own
# canary releases and pinned deps age past it without needing
# minimumReleaseAgeExclude entries.
minimumReleaseAge: 60
