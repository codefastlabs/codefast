packages:
  - apps/*
  - examples/*
  - packages/**
  - internal/*
  - benchmarks/*

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  simple-git-hooks: true

overrides:
  # Hold the whole tree to the Node floor's types — a dev tool's `@types/node: "*"` peer
  # (commitlint's cosmiconfig loader) would otherwise pull a newer major and mask floor-missing APIs.
  "@types/node": ^22.20.4
  # mermaid pins chevrotain `~11.1.2`, whose packages pin an exact lodash-es below the fix for
  # GHSA-r5fr-rjxr-66jc and GHSA-f23m-r3pf-42rh; scoped to the vulnerable range so it lapses once chevrotain moves on.
  "lodash-es@<4.18.0": ^4.18.0

catalog:
  "@babel/core": ^8.0.5
  "@babel/plugin-proposal-decorators": 8.0.2
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@commitlint/cli": ^21.2.2
  "@commitlint/config-conventional": ^21.2.2
  # Static Inter TTFs for the OG-image script — resvg cannot read @fontsource-variable/inter's woff2.
  "@expo-google-fonts/inter": ^0.4.2
  "@fontsource-variable/inter": ^5.3.0
  "@microsoft/tsdoc": ^0.17.0
  "@hono/node-server": ^2.1.1
